# قواعد التسعير والتفاوض — الكود يطبّقها حرفياً، والبوت لا يستطيع تجاوزها.

# خصم تلقائي حسب مدة الإيجار (يُطبَّق على السعر المعلن)
duration_discounts:
  - min_days: 7
    percent: 10
  - min_days: 14
    percent: 15
  - min_days: 30
    percent: 25

# التفاوض: كم خطوة تنازل قبل الوصول للحد الأدنى
# البوت يبدأ بالسعر بعد خصم المدة، وكل مرة يرفض العميل ينزل خطوة نحو الحد الأدنى.
negotiation:
  steps: 3                # عدد مرات التنازل المسموحة
  # لا يمكن أبداً النزول تحت min_daily_price × عدد الأيام (أو تحت سعر المدة إن كان أقل)
