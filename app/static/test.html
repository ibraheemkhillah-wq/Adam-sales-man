<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تجربة آدم</title>
<style>
  :root { --bg:#efeae2; --me:#d9fdd3; --bot:#fff; --bar:#075e54; --txt:#111b21; --muted:#667781; --note:#fff3c4; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background:var(--bg); color:var(--txt);
         height:100dvh; display:flex; flex-direction:column; }
  header { background:var(--bar); color:#fff; padding:10px 16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  header b { flex:1; font-size:17px; }
  header input { padding:6px 8px; border-radius:6px; border:0; width:130px; }
  header button { background:#fff2; color:#fff; border:1px solid #fff6; border-radius:6px; padding:6px 10px; cursor:pointer; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:6px; }
  .m { max-width:min(80%, 520px); padding:8px 10px; border-radius:8px; white-space:pre-wrap; line-height:1.5;
       box-shadow:0 1px 0.5px #0002; word-wrap:break-word; }
  .me { background:var(--me); align-self:flex-start; }
  .bot { background:var(--bot); align-self:flex-end; }
  .bot img { max-width:100%; border-radius:6px; display:block; }
  .note { background:var(--note); align-self:center; font-size:13px; max-width:90%; }
  .typing { color:var(--muted); align-self:flex-end; font-size:13px; }
  form { display:flex; gap:8px; padding:10px 16px; background:#f0f2f5; align-items:center; }
  form textarea { flex:1; resize:none; border:0; border-radius:8px; padding:10px; font:inherit; height:44px; }
  form button { background:var(--bar); color:#fff; border:0; border-radius:8px; padding:0 16px; height:44px; cursor:pointer; }
  label.file { cursor:pointer; font-size:22px; }
  #fname { font-size:12px; color:var(--muted); max-width:100px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <b>🚗 تجربة آدم — موظف المبيعات</b>
  <input id="pw" type="password" placeholder="كلمة السر">
  <input id="name" placeholder="اسم الزبون (اختياري)">
  <button id="reset" type="button">محادثة جديدة</button>
</header>
<div id="chat"></div>
<form id="f">
  <label class="file" title="إرفاق صورة أو PDF">📎<input id="file" type="file" accept="image/*,application/pdf" hidden></label>
  <span id="fname"></span>
  <textarea id="t" placeholder="اكتب رسالة كأنك زبون..."></textarea>
  <button>إرسال</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch {} } };
let session = store.get("adam-session") || newSession();
$("pw").value = store.get("adam-pw") || "";
function newSession(){ const s = Math.random().toString(36).slice(2,10); store.set("adam-session", s); return s; }
function add(cls, text, imgs=[]) {
  const d = document.createElement("div"); d.className = "m " + cls;
  for (const u of imgs) { const i = document.createElement("img"); i.src = u; d.appendChild(i); }
  if (text) d.appendChild(document.createTextNode(text));
  $("chat").appendChild(d); $("chat").scrollTop = 1e9; return d;
}
$("file").onchange = () => { $("fname").textContent = $("file").files[0]?.name || ""; };
$("t").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("f").requestSubmit(); } });
$("reset").onclick = async () => {
  const fd = new FormData(); fd.append("password", $("pw").value); fd.append("session", session);
  await fetch("test/api/reset", { method:"POST", body:fd });
  session = newSession(); $("chat").innerHTML = ""; add("note", "بدأت محادثة جديدة");
};
$("f").onsubmit = async (e) => {
  e.preventDefault();
  const text = $("t").value.trim(), file = $("file").files[0];
  if (!text && !file) return;
  store.set("adam-pw", $("pw").value);
  add("me", (file ? "📎 " + file.name + "\n" : "") + text);
  const fd = new FormData();
  fd.append("password", $("pw").value); fd.append("session", session);
  fd.append("text", text); fd.append("name", $("name").value);
  if (file) fd.append("file", file);
  $("t").value = ""; $("file").value = ""; $("fname").textContent = "";
  const typing = add("typing", "آدم يكتب...");
  try {
    const r = await fetch("test/api/chat", { method:"POST", body:fd });
    typing.remove();
    if (!r.ok) { add("note", "خطأ: " + (r.status === 401 ? "كلمة السر غلط" : r.status)); return; }
    const j = await r.json();
    if (j.text) add("bot", j.text);
    for (const p of j.photos) add("bot", "", [p]);
    for (const n of j.notifications) add("note", "🔔 إشعار للإدارة (" + n.kind + "): " + n.summary +
      (Object.keys(n.details||{}).length ? "\n" + Object.entries(n.details).map(([k,v]) => k + ": " + v).join("\n") : ""));
  } catch (err) { typing.remove(); add("note", "تعذر الاتصال بالخادم"); }
};
</script>
</body>
</html>
